name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Web dependencies
        run: npm install react-dom react-native-web @expo/metro-runtime

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Fix GitHub Pages base path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          s = p.read_text(encoding="utf-8")
          base = "/-Shwshawaty_asya_app/"
          s = s.replace('src="/_expo/', f'src="{base}_expo/')
          s = s.replace('href="/_expo/', f'href="{base}_expo/')
          s = s.replace('src="/favicon', f'src="{base}favicon')
          s = s.replace('href="/favicon', f'href="{base}favicon')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4